[project]
name = "open-icu"
description = "This is a project to unify and analyse data from different ICU data sources."
version = "0.0.1"
license = "MIT"
authors = [
    { name = "Paul-B98" },
    { name = "TobiasVeronaLaser" },
    { name = "prockenschaub" }
]
maintainers = [
    { name = "Paul-B98" },
    { name = "TobiasVeronaLaser" },
    { name = "prockenschaub" }
]
readme = "README.md"
keywords = ["Data", "ICU", "Healthcare"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.13"
dependencies = [
    "weavehr>=0.0.1",
]

[project.urls]
homepage = "https://github.com/aidh-ms/OpenICU"
repository = "https://github.com/aidh-ms/OpenICU"
changelog = "https://github.com/aidh-ms/OpenICU/releases"
issues = "https://github.com/aidh-ms/OpenICU/issues"
documentation = "https://github.com/aidh-ms/OpenICU/wiki"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "jupyterlab>=4.5.8",
    "pytest>=9.1.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.15.17",
    "ty>=0.0.49",
]

[tool.uv]
exclude-newer = "P1D"
exclude-newer-package = {weavehr = false}

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py", "test.py"]
filterwarnings = ["ignore::DeprecationWarning"]
pythonpath = ["src"]
addopts = [
    "--cov=src",
    "--cov-branch",
    "--cov-report=xml",
    "--cov-report=term-missing",
    "--import-mode=importlib",
]
