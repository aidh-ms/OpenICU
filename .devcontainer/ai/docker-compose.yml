services:
  openicu-ai:
    container_name: openicu-ai

    init: true

    build:
      context: ../..
      dockerfile: .devcontainer/ai/Dockerfile

    environment:
      UV_CACHE_DIR: /home/vscode/.cache/uv
      RUFF_CACHE_DIR: /home/vscode/.cache/ruff
      MYPY_CACHE_DIR: /home/vscode/.cache/mypy
      PRE_COMMIT_HOME: /home/vscode/.cache/pre-commit

    volumes:
      # Only the isolated OpenICU-ai clone.
      - ../..:/workspaces/OpenICU:cached

      # Claude may inspect the AI configuration, but may not modify it.
      - .:/workspaces/OpenICU/.devcontainer/ai:ro

      # Hide the normal OpenICU dev.env from the AI container.
      - /dev/null:/workspaces/OpenICU/.devcontainer/dev.env:ro

    command: sleep infinity
