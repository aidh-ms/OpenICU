# AUMCdb (OMOP CDM 5.4 via AMSTEL) -- maps RICU-equivalent AUMC sources:
#   6709  Saturatie (Monitor)    -> 40762499
#   8903  SO2                   -> 42869608
#   12311 O2-Saturatie (bloed)  -> 42869608, stored as fraction and converted to %
type: simple
mappings:
  - pattern:
      table: measurement
      event: MEASUREMENT
      code: "(40762499//Saturatie \\(Monitor\\)//None|42869608//SO2//.*)$"
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)
  - pattern:
      table: measurement
      event: MEASUREMENT
      code: "42869608//O2-Saturatie \\(bloed\\)//.*$"
    columns:
      numeric_value: col(numeric_value) * 100
      text_value: col(text_value)
