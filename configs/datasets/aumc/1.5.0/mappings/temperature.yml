# AUMCdb (OMOP CDM 5.4 via AMSTEL) -- maps AUMC items:
#   8658  Temp Bloed      -> OMOP measurement_concept_id 21490586
#   13952 Temp Oesophagus -> OMOP measurement_concept_id 21490588
#   16110 Temp Blaas      -> OMOP measurement_concept_id 21490870
type: simple
mappings:
  - pattern:
      table: measurement
      event: MEASUREMENT
      code: "(21490586//Temp Bloed|21490588//Temp Oesophagus|21490870//Temp Blaas)(//.*)?$"
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)
