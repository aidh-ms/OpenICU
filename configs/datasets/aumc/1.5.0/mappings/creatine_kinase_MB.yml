# AUMCdb (OMOP CDM 5.4 via AMSTEL) -- maps AUMC item 6824:
#   CK-MB -> OMOP measurement_concept_id 3005785
type: simple
mappings:
  - pattern:
      table: measurement
      event: MEASUREMENT
      code: "3005785//CK-MB(//.*)?$"
