# AUMCdb (OMOP CDM 5.4 via AMSTEL):
#   3005785 / MB-Massa (bloed) is CK-MB mass concentration in µg/L,
#   numerically equivalent to the concept unit ng/mL.
#   Activity-based CK-MB sources in IE/L or E/L are intentionally excluded.
type: simple
mappings:
  - pattern:
      table: measurement
      event: MEASUREMENT
      code: "3005785//MB-Massa \\(bloed\\)(//.*)?$"
    columns:
      numeric_value: col(numeric_value)
      text_value: col(text_value)
