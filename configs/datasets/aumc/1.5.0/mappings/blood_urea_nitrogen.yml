# AUMCdb (OMOP CDM 5.4 via AMSTEL) -- maps OMOP measurement_concept_id:
#   43534077 = Urea [Moles/volume] in Blood
type: simple
mappings:
  - pattern:
      table: measurement
      event: MEASUREMENT
      code: "43534077(//.*)?$"
    columns:
      numeric_value: col(numeric_value) * 2.8
      text_value: col(text_value)
