type: simple
mappings:
- pattern:
    table: vitalperiodic
    event: MEAN_INVASIVE_BLOOD_PRESSURE
    code: ^VITALS_PERIODIC//mmHg$
  columns: &id001
    numeric_value: col(numeric_value)
    text_value: col(text_value)
- pattern:
    table: vitalaperiodic
    event: NON_INVASIVE_MEAN_BLOOD_PRESSURE
    code: ^VITALS_APERIODIC$
  columns: *id001
