path: diagnosis.csv.gz

columns:
  # identifiers
  - name: subject_id
    type: int64
  - name: stay_id
    type: int64

  # values
  - name: seq_num
    type: int64
  - name: icd_code
    type: string
  - name: icd_version
    type: int64
  - name: icd_title
    type: string

join:
  - name: edstays
    path: edstays.csv.gz

    columns:
      - name: stay_id
        type: int64
      - name: intime
        type: datetime
        params:
          format: "%Y-%m-%d %H:%M:%S"

    both_on:
      - stay_id

event_defaults:
  subject_id: col(subject_id)
  time: col(intime)
  extension:
    stay_id: col(stay_id)
    sequence: col(seq_num)
    available_time: col(intime)

events:
  - name: DIAGNOSIS
    columns:
      code:
        - const(ICD)
        - col(icd_version)
        - col(icd_code)
      text_value: col(icd_title)
    filters:
      - drop_na(icd_code)
