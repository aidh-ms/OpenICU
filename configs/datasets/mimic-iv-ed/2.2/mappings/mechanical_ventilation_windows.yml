type: simple
mappings:
  # Ventilation is a state, not a measurement: the procedure events bound an
  # episode, so the window opens at its start and closes at its end. The
  # consumer carries the flag forward without expiry, which is why the close
  # has to be charted rather than left to a lookback expiring.
  - pattern:
      table: procedureevents
      event: PROCEDURE_START
      code: (225792(//.*)?|225794(//.*)?)
    columns:
      numeric_value: const(1)
  - pattern:
      table: procedureevents
      event: PROCEDURE_END
      code: (225792(//.*)?|225794(//.*)?)
    columns:
      numeric_value: const(0)
