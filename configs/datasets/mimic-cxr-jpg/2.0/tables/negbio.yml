    filters:
    - drop_na(numeric_value)

  - name: CXR_LUNG_OPACITY
    columns:
      code:
        - const("CXR_LUNG_OPACITY")
      numeric_value: col("Lung Opacity")
    filters:
    - drop_na(numeric_value)

  - name: CXR_NO_FINDING
