    - drop_na(numeric_value)

  - name: CXR_PLEURAL_EFFUSION
    columns:
      code:
        - const("CXR_PLEURAL_EFFUSION")
      numeric_value: col("Pleural Effusion")
    filters:
    - drop_na(numeric_value)

  - name: CXR_PLEURAL_OTHER
    columns:
      code:
        - const("CXR_PLEURAL_OTHER")
      numeric_value: col("Pleural Other")
