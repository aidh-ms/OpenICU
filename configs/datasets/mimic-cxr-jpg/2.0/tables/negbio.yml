path: mimic-cxr-2.0.0-negbio.csv.gz

columns:
  # subject_id and extentions
  - name: subject_id
    type: int64
  - name: study_id
    type: int64
  # db fields - times
  # db fields - values
  - name: Atelectasis
    type: float32
  - name: Cardiomegaly
    type: float32
  - name: Consolidation
    type: float32
  - name: Edema
    type: float32
  - name: Enlarged Cardiomediastinum
    type: float32
  - name: Fracture
    type: float32
  - name: Lung Lesion
    type: float32
  - name: Lung Opacity
    type: float32
  - name: No Finding
    type: float32
  - name: Pleural Effusion
    type: float32
  - name: Pleural Other
    type: float32
  - name: Pneumonia
    type: float32
  - name: Pneumothorax
    type: float32
  - name: Support Devices
    type: float32

join:
  - name: metadata
    path: mimic-cxr-2.0.0-metadata.csv.gz
    columns:
      - name: subject_id
        type: int64
      - name: study_id
        type: int64
      - name: StudyDate
        type: string
      - name: StudyTime
        type: float64
    both_on:
      - subject_id
      - study_id
    pre_callbacks:
      - parse_date_time("StudyDate", zero_pad_int("StudyTime", width=6, round_ndigits=3), format="%Y%m%d%H%M%S%.f", output="time")
    pre_filters:
      - first_distinct(subject_id, study_id)

event_defaults:
  subject_id: col(subject_id)
  time: col(time)
  extension:
    study_id: col("study_id")
  filters:
    - drop_na(numeric_value)

events:
  - name: CXR_ATELECTASIS
    columns:
      code:
        - const("CXR_ATELECTASIS")
      numeric_value: col("Atelectasis")
    filters:
    - drop_na(numeric_value)

  - name: CXR_CARDIOMEGALY
    columns:
      code:
        - const("CXR_CARDIOMEGALY")
      numeric_value: col("Cardiomegaly")
    filters:
    - drop_na(numeric_value)

  - name: CXR_CONSOLIDATION
    columns:
      code:
        - const("CXR_CONSOLIDATION")
      numeric_value: col("Consolidation")
    filters:
    - drop_na(numeric_value)

  - name: CXR_EDEMA
    columns:
      code:
        - const("CXR_EDEMA")
      numeric_value: col("Edema")
    filters:
    - drop_na(numeric_value)

  - name: CXR_ENLARGED_CARDIOMEDIASTINUM
    columns:
      code:
        - const("CXR_ENLARGED_CARDIOMEDIASTINUM")
      numeric_value: col("Enlarged Cardiomediastinum")
    filters:
    - drop_na(numeric_value)

  - name: CXR_FRACTURE
    columns:
      code:
        - const("CXR_FRACTURE")
      numeric_value: col("Fracture")
    filters:
    - drop_na(numeric_value)

  - name: CXR_LUNG_LESION
    columns:
      code:
        - const("CXR_LUNG_LESION")
