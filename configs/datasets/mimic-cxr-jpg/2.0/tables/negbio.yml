    - drop_na(numeric_value)

  - name: CXR_PNEUMONIA
    columns:
      code:
        - const("CXR_PNEUMONIA")
      numeric_value: col("Pneumonia")
    filters:
    - drop_na(numeric_value)

  - name: CXR_PNEUMOTHORAX
    columns:
      code:
        - const("CXR_PNEUMOTHORAX")
