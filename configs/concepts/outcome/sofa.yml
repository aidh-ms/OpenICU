name: sofa
version: 1.0.0
unit: points
extension_columns:
  dataset: col("dataset")

# Nothing about the total is dataset-specific: it sums whichever sub-scores a
# dataset was able to produce. A dataset needing something else — a charted
# ground-truth SOFA, say — overrides this with its own mapping, and one that
# should not have the concept at all tombstones it with `deleted: true`.
default:
  type: complex
  concept_transformer: open_icu.steps.concept.transformer.sofa.SofaTransformer
  concepts:
    - sofa_respiratory.1.0.0
    - sofa_coagulation.1.0.0
    - sofa_liver.1.0.0
    - sofa_cardiovascular.1.0.0
    - sofa_cns.1.0.0
    - sofa_renal.1.0.0
